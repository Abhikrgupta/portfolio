<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <clipPath id="avatar-clip">
      <rect width="96" height="96" rx="14" ry="14" />
    </clipPath>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1220" />
      <stop offset="100%" stop-color="#060a12" />
    </linearGradient>
    <filter id="mint-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00ff9d" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g clip-path="url(#avatar-clip)">
    <rect width="96" height="96" fill="url(#bg-grad)" />
    
    <!-- Subtle background grid -->
    <path d="M0 24h96M0 48h96M0 72h96M24 0v96M48 0v96M72 0v96" stroke="rgba(0,255,157,0.06)" stroke-width="0.5"/>
    
    <!-- Silhouette with mint rim light -->
    <!-- Suit Body -->
    <path d="M12 96 C14 74, 30 68, 48 68 C66 68, 82 74, 84 96 Z" fill="#0f172a" stroke="#00ff9d" stroke-width="1.2" filter="url(#mint-glow)"/>
    <!-- Shirt collar -->
    <path d="M41 68 L48 82 L55 68 Z" fill="#f8fafc" />
    <!-- Navy Tie -->
    <path d="M46 72 L50 72 L51 90 L48 94 L45 90 Z" fill="#1e293b" />
    <!-- Neck -->
    <rect x="42" y="56" width="12" height="15" rx="3" fill="#d4a373" />
    <!-- Head -->
    <ellipse cx="48" cy="42" rx="17" ry="21" fill="#e0ab76" stroke="#00ff9d" stroke-width="0.75" />
    <!-- Hair -->
    <path d="M31 38 C30 24, 40 18, 48 18 C58 18, 66 24, 65 38 C62 30, 56 24, 48 24 C38 24, 33 30, 31 38 Z" fill="#090d16" stroke="#00ff9d" stroke-width="0.8" />
    <!-- Beard -->
    <path d="M34 44 C34 58, 42 63, 48 63 C54 63, 62 58, 62 44 C60 52, 54 57, 48 57 C42 57, 36 52, 34 44 Z" fill="#1e293b" />
    <!-- Mustache -->
    <path d="M41 49 C44 47, 52 47, 55 49 C52 51, 44 51, 41 49 Z" fill="#1e293b" />
    <!-- Glasses -->
    <rect x="34" y="36" width="11" height="9" rx="2.5" fill="none" stroke="#94a3b8" stroke-width="1.2" />
    <rect x="51" y="36" width="11" height="9" rx="2.5" fill="none" stroke="#94a3b8" stroke-width="1.2" />
    <path d="M45 40 L51 40" stroke="#94a3b8" stroke-width="1.2" />
    <path d="M34 38 L30 37 M62 38 L66 37" stroke="#94a3b8" stroke-width="1" />
    <!-- Eyes -->
    <circle cx="39.5" cy="40.5" r="1.5" fill="#0f172a" />
    <circle cx="56.5" cy="40.5" r="1.5" fill="#0f172a" />
    <!-- Border around container -->
    <rect width="96" height="96" rx="14" ry="14" fill="none" stroke="#00ff9d" stroke-width="1.5" stroke-opacity="0.4" />
  </g>
</svg>
